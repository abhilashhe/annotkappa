[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "abhilashhe-annotkappa"
version = "0.1.0"
description = "计算 Cohen's Kappa 或 Fleiss' Kappa，列出分歧最大的条目"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "abhilashhe" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://abhilashhe.github.io"
Repository = "https://github.com/abhilashhe/annotkappa"
Issues = "https://github.com/abhilashhe/annotkappa/issues"

[project.scripts]
annotkappa = "annotkappa:main"

[tool.setuptools]
py-modules = ["annotkappa"]
